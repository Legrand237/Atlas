# Configuration d'Alembic (migrations de la base). Commandes à lancer depuis backend/ :
#   alembic upgrade head      applique les migrations
#   alembic current           affiche la version appliquée
# L'adresse de la base N'EST PAS ici : elle est lue dans DATABASE_URL (backend/.env), jamais écrite dans ce fichier.
[alembic]
script_location = %(here)s/app/db/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
